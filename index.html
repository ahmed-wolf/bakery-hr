<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المخبز | الحضور والسرك</title>
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #14171c;
    --panel-2: #1b1f26;
    --panel-3: #22262e;
    --line: #262b33;
    --text: #eceef1;
    --text-dim: #8b93a1;
    --text-faint: #5a6270;
    --amber: #e8a33d;
    --amber-soft: rgba(232, 163, 61, 0.14);
    --ok: #4caf7d;
    --ok-soft: rgba(76, 175, 125, 0.14);
    --danger: #e05a4e;
    --danger-soft: rgba(224, 90, 78, 0.14);
    --info: #4d8de0;
    --radius: 12px;
    --sans: "Segoe UI", "Tahoma", "Cairo", "Dubai", sans-serif;
    --mono: "Consolas", "SF Mono", monospace;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--amber-soft); color: var(--amber); }

  body {
    margin: 0;
    background: radial-gradient(1200px 500px at 15% -10%, rgba(232,163,61,0.06), transparent), var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 0 0 100px;
    min-height: 100vh;
  }

  a, button, select, input { font-family: inherit; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(10,12,15,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 12px var(--amber);
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
  .brand .sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .last-sync { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }

  button {
    cursor: pointer; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); padding: 9px 16px; border-radius: 8px;
    font-size: 13.5px; font-weight: 600; transition: transform 0.12s ease, filter 0.15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { filter: brightness(1.18); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button.btn-primary { background: var(--amber); color: #1a1400; border-color: var(--amber); }
  button.btn-ok { background: var(--ok); color: #06210f; border-color: var(--ok); }
  button.btn-info { background: var(--info); color: #061527; border-color: var(--info); }
  button.btn-ghost { background: transparent; }
  button.btn-sm { padding: 6px 11px; font-size: 12px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 24px; }
  .tabs {
    display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px; width: fit-content; margin-bottom: 22px;
  }
  .tab-btn {
    background: transparent; border: none; padding: 9px 20px; border-radius: 7px;
    color: var(--text-dim); font-weight: 700; font-size: 13.5px;
  }
  .tab-btn.active { background: var(--amber); color: #1a1400; }
  .tab-btn:hover:not(.active) { background: var(--panel-3); color: var(--text); }
  .view { display: none; animation: fadeUp 0.28s ease; }
  .view.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--text-faint); }
  select, input {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
  }
  select:focus, input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .spacer { flex: 1; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat-card .label { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }
  .stat-card .value { font-family: var(--mono); font-size: 21px; font-weight: 700; }
  .stat-card .value.amber { color: var(--amber); }
  .stat-card .value.ok { color: var(--ok); }

  .emp-group {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow);
  }
  .emp-group-header {
    display: flex; align-items: center; gap: 10px; padding: 13px 16px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
  }
  .emp-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--amber-soft);
    color: var(--amber); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .emp-group-header .name { font-weight: 700; font-size: 14.5px; }
  .emp-group-header .id { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .emp-group-header .count-badge { margin-inline-start: auto; background: var(--panel-3); color: var(--text-dim); font-size: 11px; padding: 3px 10px; border-radius: 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: right; padding: 9px 14px; color: var(--text-faint); font-size: 11px; border-bottom: 1px solid var(--line); font-weight: 600; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr.row-missing { border-inline-start: 3px solid var(--danger); background: var(--danger-soft); }
  tbody tr.row-manual td:first-child { border-inline-start: 3px solid var(--info); }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag.missing { background: var(--danger-soft); color: var(--danger); }
  .tag.manual { background: rgba(77,141,224,0.15); color: var(--info); }
  .tag.bonus { background: rgba(76,175,125,0.15); color: var(--ok); }
  .tag.deduction { background: var(--danger-soft); color: var(--danger); }
  .tag.vacation { background: rgba(77,141,224,0.15); color: var(--info); }

  .row-status-cell { display: flex; align-items: center; gap: 8px; }
  .save-indicator { width: 14px; height: 14px; flex-shrink: 0; }
  .spin {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--amber);
    animation: spin 0.6s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check-tick { color: var(--ok); font-size: 14px; animation: popIn 0.25s ease; }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  input.masrouf-input { width: 90px; }

  .sarak-table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 20px; }
  .sarak-table-wrap table { font-size: 13.5px; }
  .sarak-table-wrap thead th { background: var(--panel-2); }
  .net-pay { color: var(--ok); font-weight: 800; font-family: var(--mono); }
  .section-title { font-size: 14px; font-weight: 700; color: var(--text-dim); margin: 22px 0 10px; }

  .pin-gate { max-width: 340px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; text-align: center; box-shadow: var(--shadow); }
  .pin-gate .lock-icon { font-size: 34px; margin-bottom: 10px; }
  .pin-gate h3 { margin: 0 0 6px; font-size: 16px; }
  .pin-gate p { color: var(--text-dim); font-size: 12.5px; margin-bottom: 18px; }
  .pin-gate input { width: 100%; text-align: center; font-size: 22px; letter-spacing: 10px; font-family: var(--mono); padding: 12px; margin-bottom: 14px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-faint); }
  .empty-state .icon { font-size: 30px; margin-bottom: 10px; }
  .empty-state .msg { font-size: 13px; }

  #toastContainer { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 999; align-items: center; }
  .toast { background: var(--panel-3); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; animation: toastIn 0.25s ease; min-width: 200px; }
  .toast.success { border-color: var(--ok); }
  .toast.error { border-color: var(--danger); }
  .toast.fade-out { animation: toastOut 0.3s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; width: 360px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
  dialog h3 { margin: 0 0 16px; font-size: 15px; color: var(--amber); }
  dialog label { display: block; margin-bottom: 5px; color: var(--text-faint); font-size: 12px; }
  dialog select, dialog input { width: 100%; margin-bottom: 14px; }
  .dialog-btns { display: flex; justify-content: flex-start; gap: 8px; margin-top: 4px; }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; right: 0; width: 100%; color: #000; background: #fff; padding: 30px; }
    .slip-box { border: 2px solid #000; padding: 24px; border-radius: 0; }
    .slip-box h2 { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; }
    .slip-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #999; font-size: 15px; }
    .slip-row.total { font-size: 20px; font-weight: 800; border-bottom: none; border-top: 2px solid #000; margin-top: 10px; padding-top: 14px; }
    .slip-sign { margin-top: 50px; display: flex; justify-content: space-between; font-size: 13px; }
    .slip-sign div { border-top: 1px solid #000; width: 40%; text-align: center; padding-top: 6px; }
  }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    header { padding: 12px 16px; }
    main { padding: 16px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    tbody td { display: flex; justify-content: space-between; align-items: center; border-bottom: none; padding: 6px 2px; }
    tbody td::before { content: attr(data-label); color: var(--text-faint); font-size: 11px; font-weight: 600; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>لوحة تحكم المخبز</h1>
      <div class="sub">الحضور · السرك · إدارة الورديات</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="last-sync" id="lastSync">لسه ما اتحمّلش</span>
    <button id="loadBtn" class="btn-primary">🔄 تحديث البيانات</button>
  </div>
</header>
<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="daily">📋 المراجعة اليومية</button>
    <button class="tab-btn" data-tab="sarak">💰 السرك الشهري</button>
  </div>

  <section id="dailyView" class="view active">
    <div class="stat-row" id="dailyStats"></div>
    <div class="controls">
      <button class="btn-info" id="openManualBtn">➕ إضافة بصمة يدوية</button>
      <button class="btn-ghost" id="toggleIgnoredBtn">👀 إظهار المتجاهل</button>
      <div class="field">
        <label>من تاريخ</label>
        <input type="date" id="dailyDateFrom">
      </div>
      <div class="field">
        <label>إلى تاريخ</label>
        <input type="date" id="dailyDateTo">
      </div>
      <div class="field">
        <label>الموظف</label>
        <select id="filterEmpDaily"><option value="">كل العمال</option></select>
      </div>
      <button class="btn-ghost btn-sm" id="clearDateBtn">عرض كل الأيام</button>
      <div class="spacer"></div>
    </div>
    <div id="dailyContent"></div>
  </section>

  <section id="sarakView" class="view">
    <div id="sarakGate"></div>
    <div id="sarakContent" style="display:none;">
      <div class="stat-row" id="sarakStats"></div>
      <div class="controls">
        <div class="field"><label>من تاريخ</label><input type="date" id="sarakFrom"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" id="sarakTo"></div>
        <div class="field"><label>بحث</label><input type="text" id="sarakSearch" placeholder="اسم أو كود الموظف"></div>
        <div class="spacer"></div>
        <button class="btn-info" id="openEmpBtn">➕ موظف جديد</button>
        <button class="btn-info" id="openTransBtn">💵 تسجيل معاملة</button>
        <button class="btn-ghost" id="exportCsvBtn">⬇️ تصدير Excel</button>
      </div>
      <div class="sarak-table-wrap">
        <table>
          <thead>
            <tr>
              <th>كود</th><th>الاسم</th><th>أيام الحضور</th><th>صافي الساعات</th>
              <th>أجر الساعة</th><th>إجمالي الراتب</th><th>المسحوبات</th><th>خصومات/مكافآت</th><th>صافي القبض</th><th></th>
            </tr>
          </thead>
          <tbody id="sarakBody"></tbody>
        </table>
      </div>

      <div class="section-title">📜 آخر المعاملات المالية</div>
      <div class="sarak-table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th></tr></thead>
          <tbody id="transBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<dialog id="manualDialog">
  <h3>➕ إضافة بصمة يدوية</h3>
  <label>الموظف</label><select id="manualEmp"></select>
  <label>تاريخ ووقت البصمة</label><input type="datetime-local" id="manualTime">
  <label>نوع البصمة</label>
  <select id="manualStatus"><option value="IN">دخول</option><option value="OUT">خروج</option></select>
  <label>المصروف (لو سحب فلوس دلوقتي)</label><input type="number" id="manualMasrouf" value="0">
  <label>سبب البصمة اليدوي (اختياري)</label><input type="text" id="manualReason" placeholder="مثلاً: نسي يبصم، عطل في الماكينة">
  <div class="dialog-btns">
    <button class="btn-ok" id="saveManualBtn">حفظ البصمة</button>
    <button class="btn-ghost" id="cancelManualBtn">إلغاء</button>
  </div>
</dialog>

<dialog id="employeeDialog">
  <h3>➕ إضافة موظف جديد</h3>
  <label>كود الموظف</label><input type="number" id="empId">
  <label>الاسم</label><input type="text" id="empName">
  <label>المرتب الشهري</label><input type="number" id="empSalary" value="0">
  <label>سعر الساعة</label><input type="number" id="empRate" value="0" step="0.01">
  <div class="dialog-btns">
    <button class="btn-ok" id="saveEmpBtn">حفظ</button>
    <button class="btn-ghost" id="cancelEmpBtn">إلغاء</button>
  </div>
</dialog>

<dialog id="transactionDialog">
  <h3>💵 تسجيل معاملة مالية</h3>
  <label>الموظف</label><select id="transEmp"></select>
  <label>نوع المعاملة</label>
  <select id="transType">
    <option value="Deduction">خصم</option>
    <option value="Bonus">مكافأة</option>
    <option value="VacationPay">بدل إجازة</option>
  </select>
  <label>المبلغ</label><input type="number" id="transAmount" value="0">
  <label>ملاحظة (اختياري)</label><input type="text" id="transNote">
  <div class="dialog-btns">
    <button class="btn-ok" id="saveTransBtn">حفظ</button>
    <button class="btn-ghost" id="cancelTransBtn">إلغاء</button>
  </div>
</dialog>

<div id="toastContainer"></div>
<div id="printArea"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwGIoLgeclTzo9wiOm8kHDmxliKDyXeHbHcBqh87zfJ1zC-rK8k3zpu0ORX5ko9zpsI/exec"; 

";
const SARAK_PIN = "1234";

let appData = { employees: [], logs: [], transactions: [] };
let sarakUnlocked = false;
let showIgnored = false;

function showToast(msg, type = "info") {
  const icons = { success: "✅", error: "⚠️", info: "ℹ️" };
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="icon">${icons[type]}</span><span>${msg}</span>`;
  document.getElementById("toastContainer").appendChild(el);
  setTimeout(() => {
    el.classList.add("fade-out");
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    const target = btn.dataset.tab === "daily" ? "dailyView" : "sarakView";
    document.getElementById(target).classList.add("active");
    if (btn.dataset.tab === "sarak") renderSarakTab();
  });
});

function toDateInputValue(d) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function firstOfMonth() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function fmtDate(dStr) {
  const d = new Date(dStr);
  return d.toLocaleDateString("ar-EG", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtTimeOnly(dStr) {
  const d = new Date(dStr);
  return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", hour12: true });
}

async function loadData() {
  const btn = document.getElementById("loadBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري التحميل...";
  try {
    const res = await fetch(API_URL);
    appData = await res.json();
    if (!appData.transactions) appData.transactions = [];
    populateFilters();
    renderDailyTab();
    if (document.getElementById("sarakView").classList.contains("active")) renderSarakTab();
    document.getElementById("lastSync").textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar-EG");
    showToast("تم تحديث البيانات", "success");
  } catch (err) {
    showToast("مشكلة في تحميل البيانات: " + err.message, "error");
  }
  btn.disabled = false; btn.textContent = "🔄 تحديث البيانات";
}

function populateFilters() {
  let opts = '<option value="">كل العمال</option>';
  let plainOpts = "";
  [...appData.employees].sort((a, b) => a.name.localeCompare(b.name, "ar")).forEach(e => {
    opts += `<option value="${e.id}">${e.name}</option>`;
    plainOpts += `<option value="${e.id}">${e.name}</option>`;
  });
  document.getElementById("filterEmpDaily").innerHTML = opts;
  document.getElementById("manualEmp").innerHTML = plainOpts;
  document.getElementById("transEmp").innerHTML = plainOpts;
}

function renderDailyTab() {
  const fromVal = document.getElementById("dailyDateFrom").value;
  const toVal = document.getElementById("dailyDateTo").value;
  const empFilter = document.getElementById("filterEmpDaily").value;
  const container = document.getElementById("dailyContent");

  let logs = [...appData.logs];
  const fromDate = fromVal ? new Date(fromVal + "T00:00:00") : null;
  const toDate = toVal ? new Date(toVal + "T23:59:59") : null;

  logs = logs.filter(l => {
    const logDate = new Date(l.timestamp);
    if (fromDate && logDate < fromDate) return false;
    if (toDate && logDate > toDate) return false;
    return true;
  });

  if (empFilter) logs = logs.filter(l => l.userId === empFilter);

  if (!showIgnored) logs = logs.filter(l => l.status !== "IGNORE");

  const total = logs.length;
  const missing = logs.filter(l => !l.status).length;
  const manual = logs.filter(l => l.manual).length;
  const totalMasrouf = logs.reduce((s, l) => s + (parseFloat(l.masrouf) || 0), 0);

  document.getElementById("dailyStats").innerHTML = `
    <div class="stat-card"><div class="label">عدد البصمات</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">تحتاج مراجعة</div><div class="value ${missing ? "" : "ok"}" style="${missing ? "color:var(--danger)" : ""}">${missing}</div></div>
    <div class="stat-card"><div class="label">بصمات يدوية</div><div class="value">${manual}</div></div>
    <div class="stat-card"><div class="label">إجمالي المصروف</div><div class="value amber">${totalMasrouf.toFixed(0)} ج</div></div>
  `;

  if (!logs.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="msg">مفيش بصمات في الفترة دي.</div></div>`;
    return;
  }

  const groups = {};
  logs.forEach(l => (groups[l.userId] ??= []).push(l));

  const employeeOrder = Object.keys(groups).sort((a, b) => {
    const maxA = Math.max(...groups[a].map(l => new Date(l.timestamp)));
    const maxB = Math.max(...groups[b].map(l => new Date(l.timestamp)));
    return maxB - maxA;
  });

  container.innerHTML = "";
  employeeOrder.forEach(userId => {
    const emp = appData.employees.find(e => e.id === userId);
    if (!emp) return;

    const empLogs = groups[userId].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    const card = document.createElement("div");
    card.className = "emp-group";
    card.innerHTML = `
      <div class="emp-group-header">
        <div class="emp-avatar">${emp.name.trim()[0] || "?"}</div>
        <div><div class="name">${emp.name}</div><div class="id">كود ${emp.id}</div></div>
        <div class="count-badge">${empLogs.length} بصمة</div>
      </div>
      <table>
        <thead><tr><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>المصروف</th><th></th></tr></thead>
        <tbody>${empLogs.map(rowTemplate).join("")}</tbody>
      </table>
    `;
    container.appendChild(card);
  });

  attachDailyRowEvents();
}

function rowTemplate(log) {
  const missing = !log.status;
  return `
    <tr class="${missing ? "row-missing" : ""} ${log.manual ? "row-manual" : ""}" data-row="${log.row}">
      <td data-label="التاريخ">${fmtDate(log.timestamp)}</td>
      <td data-label="الوقت" style="font-family:var(--mono)">${fmtTimeOnly(log.timestamp)}</td>
      <td data-label="الحالة">
        <div class="row-status-cell">
          <select class="status-select" data-row="${log.row}">
            <option value="" ${!log.status ? "selected" : ""}>-- حدد --</option>
            <option value="IN" ${log.status === "IN" ? "selected" : ""}>دخول</option>
            <option value="OUT" ${log.status === "OUT" ? "selected" : ""}>خروج</option>
            <option value="IGNORE" ${log.status === "IGNORE" ? "selected" : ""}>تجاهل</option>
          </select>
          ${missing ? '<span class="tag missing">غير محدد</span>' : ""}
          ${log.manual ? `<span class="tag manual" title="${log.reason ? log.reason.replace(/"/g, '&quot;') : ''}">يدوي${log.reason ? " · " + log.reason : ""}</span>` : ""}
        </div>
      </td>
      <td data-label="المصروف"><input type="number" class="masrouf-input" data-row="${log.row}" value="${log.masrouf || 0}"></td>
      <td><span class="save-indicator" id="ind_${log.row}"></span></td>
    </tr>
  `;
}

const saveTimers = {};
function attachDailyRowEvents() {
  document.querySelectorAll(".status-select").forEach(sel => {
    sel.addEventListener("change", () => {
      updateLocalLog(sel.dataset.row, "status", sel.value);
      commitRowSave(sel.dataset.row);
      sel.closest("tr").classList.toggle("row-missing", !sel.value);
      if (sel.value === "IGNORE" && !showIgnored) {
        const tr = sel.closest("tr");
        tr.style.transition = "opacity 0.2s ease";
        tr.style.opacity = "0";
        setTimeout(() => tr.remove(), 200);
      }
    });
  });
  document.querySelectorAll(".masrouf-input").forEach(inp => {
    inp.addEventListener("input", () => {
      updateLocalLog(inp.dataset.row, "masrouf", inp.value);
      clearTimeout(saveTimers[inp.dataset.row]);
      saveTimers[inp.dataset.row] = setTimeout(() => commitRowSave(inp.dataset.row), 700);
    });
    inp.addEventListener("blur", () => { clearTimeout(saveTimers[inp.dataset.row]); commitRowSave(inp.dataset.row); });
  });
}

function updateLocalLog(rowNum, field, value) {
  const entry = appData.logs.find(l => String(l.row) === String(rowNum));
  if (entry) entry[field] = value;
}

async function commitRowSave(rowNum) {
  const entry = appData.logs.find(l => String(l.row) === String(rowNum));
  if (!entry) return;
  const indicator = document.getElementById(`ind_${rowNum}`);
  if (indicator) indicator.innerHTML = '<span class="spin"></span>';

  try {
    await fetch(API_URL, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "update", row: Number(rowNum), status: entry.status, masrouf: entry.masrouf }),
    });
    if (indicator) { indicator.innerHTML = '<span class="check-tick">✓</span>'; setTimeout(() => { if (indicator) indicator.innerHTML = ""; }, 1500); }
    showToast("تم الحفظ", "success");
  } catch (err) {
    if (indicator) indicator.innerHTML = "⚠️";
    showToast("فشل الحفظ", "error");
  }
}

function withinRange(date, from, to) {
  if (from && date < from) return false;
  if (to && date > to) return false;
  return true;
}

function computeSarakRow(emp, fromDate, toDate) {
  const myLogs = appData.logs
    .filter(l => l.userId === emp.id && l.status !== "IGNORE" && l.status !== "")
    .filter(l => withinRange(new Date(l.timestamp), fromDate, toDate))
    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

  let totalHours = 0, attendanceDays = 0, totalMasrouf = 0, openIn = null;
  myLogs.forEach(log => {
    totalMasrouf += parseFloat(log.masrouf) || 0;
    if (log.status === "IN") { openIn = new Date(log.timestamp); }
    else if (log.status === "OUT" && openIn) {
      const diff = (new Date(log.timestamp) - openIn) / 3600000;
      if (diff > 0 && diff < 24) { totalHours += diff; attendanceDays += 1; }
      openIn = null;
    }
  });

  const myTrans = (appData.transactions || [])
    .filter(t => t.userId === emp.id)
    .filter(t => withinRange(new Date(t.timestamp), fromDate, toDate));

  let bonuses = 0, deductions = 0, vacationPay = 0;
  myTrans.forEach(t => {
    const amt = parseFloat(t.amount) || 0;
    if (t.type === "Deduction") deductions += amt;
    else if (t.type === "Bonus") bonuses += amt;
    else if (t.type === "VacationPay") vacationPay += amt;
  });

  const hourlyRate = parseFloat(emp.rate) || 0;
  const totalSalary = totalHours * hourlyRate;
  const adjustments = bonuses + vacationPay - deductions;
  const netPay = totalSalary - totalMasrouf + adjustments;

  return { emp, attendanceDays, totalHours, hourlyRate, totalSalary, totalMasrouf, bonuses, deductions, vacationPay, adjustments, netPay };
}

function renderSarak() {
  const fromVal = document.getElementById("sarakFrom").value;
  const toVal = document.getElementById("sarakTo").value;
  const search = document.getElementById("sarakSearch").value.trim().toLowerCase();

  const toDate = toVal ? new Date(toVal + "T23:59:59") : null;

  const rows = appData.employees
    .filter(e => !search || e.name.toLowerCase().includes(search) || String(e.id).includes(search))
    .map(e => computeSarakRow(e, fromDate, toDate))
    .filter(r => r.attendanceDays > 0 || r.totalMasrouf > 0 || r.bonuses > 0 || r.deductions > 0 || r.vacationPay > 0);

  document.getElementById("sarakStats").innerHTML = `
    <div class="stat-card"><div class="label">عدد العمال</div><div class="value">${rows.length}</div></div>
    <div class="stat-card"><div class="label">إجمالي الساعات</div><div class="value">${rows.reduce((s, r) => s + r.totalHours, 0).toFixed(1)}</div></div>
    <div class="stat-card"><div class="label">إجمالي الرواتب الصافية</div><div class="value ok">${rows.reduce((s, r) => s + r.netPay, 0).toFixed(0)} ج</div></div>
    <div class="stat-card"><div class="label">الفترة</div><div class="value" style="font-size:13px">${fromVal ? fmtDate(fromVal) : "البداية"} → ${toVal ? fmtDate(toVal) : "النهاردة"}</div></div>
  `;

  const tbody = document.getElementById("sarakBody");
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><div class="icon">🧾</div><div class="msg">مفيش بيانات.</div></div></td></tr>`; }
  else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td data-label="كود">${r.emp.id}</td><td data-label="الاسم">${r.emp.name}</td>
        <td data-label="أيام الحضور">${r.attendanceDays}</td><td data-label="صافي الساعات">${r.totalHours.toFixed(2)}</td>
        <td data-label="أجر الساعة">${r.hourlyRate.toFixed(2)}</td><td data-label="إجمالي الراتب">${r.totalSalary.toFixed(2)}</td>
        <td data-label="المسحوبات">${r.totalMasrouf.toFixed(2)}</td>
        <td data-label="خصومات/مكافآت" style="color:${r.adjustments >= 0 ? 'var(--ok)' : 'var(--danger)'}">${r.adjustments >= 0 ? "+" : ""}${r.adjustments.toFixed(2)}</td>
        <td data-label="صافي القبض" class="net-pay">${r.netPay.toFixed(2)}</td>
        <td><button class="btn-sm btn-ghost print-btn" data-id="${r.emp.id}">🖨️ طباعة</button></td>
      </tr>
    `).join("");

    tbody.querySelectorAll(".print-btn").forEach(btn => {
      btn.addEventListener("click", () => printSlip(rows.find(r => r.emp.id === btn.dataset.id), fromVal, toVal));
    });
  }

  renderTransactionsTable();
}
